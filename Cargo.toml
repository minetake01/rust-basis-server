[workspace]
resolver = "2"
members = [
    "crates/basis-wire",
    "crates/basis-crypto",
    "crates/basis-protocol",
    "crates/basis-avatar",
    "crates/basis-config",
    "crates/basis-logging",
    "crates/basis-health",
    "crates/basis-control",
    "crates/basis-p2p",
    "crates/basis-telemetry",
    "crates/basis-permissions",
    "crates/basis-setup",
    "crates/basis-transport",
    "bin/basis-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
uds_windows = "1"
flate2 = "1"
anyhow = "1"
thiserror = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
sha2 = "0.10"
rand = "0.8"
parking_lot = "0.12"
crossbeam-channel = "0.5"
hex = "0.4"
roxmltree = "0.20"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1







